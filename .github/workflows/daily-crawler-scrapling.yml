name: Daily News Crawler (Scrapling 0.4.2+)

on:
  push:
    branches:
      - test_scrapling
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: 1
  PYTHONIOENCODING: utf-8

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        site:
          - AITIMES
          - TECHWORLD
          - BUSINESSPOST
    
    steps:
      - name: Checkout test_scrapling
        uses: actions/checkout@v4
        with:
          ref: test_scrapling
      
      # 🆕 캐시 없이 Python 설치
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # cache 옵션 제거! (이전 0.2.x 캐시 사용 방지)
      
      # 🆕 Scrapling 0.4.2+ 강제 설치
      - name: Install Scrapling 0.4.2+ (forced upgrade)
        run: |
          python -m pip install --upgrade pip
          
          # 기존 scrapling 완전 제거
          pip uninstall -y scrapling || true
          
          # 캐시 무시 + 버전 명시 + 강제 업그레이드
          pip install --no-cache-dir --upgrade "scrapling[fetchers]>=0.4.2"
          pip install --no-cache-dir pandas
          
          echo ""
          echo "=== 설치된 패키지 ==="
          pip list | grep -iE "scrapling|playwright|lxml|cssselect"
      
      # 🆕 Scrapling 버전 검증 (0.4+ 필수)
      - name: Verify Scrapling version
        run: |
          python << 'PYEOF'
          import sys
          try:
              import scrapling
              v = scrapling.__version__
              print(f"📌 Scrapling 버전: {v}")
              
              # 버전 파싱
              parts = v.split('.')
              major = int(parts[0])
              minor = int(parts[1]) if len(parts) > 1 else 0
              
              if major == 0 and minor < 4:
                  print(f"❌ ERROR: Scrapling {v}는 너무 낮음. 0.4+ 필요")
                  print("   pip uninstall scrapling && pip install --no-cache-dir 'scrapling[fetchers]>=0.4.2'")
                  sys.exit(1)
              
              print(f"✅ Scrapling {v} OK")
              
              # API 검증: css_first 확인
              from scrapling.parser import Selector
              dummy = Selector('<html><body><a href="x">y</a></body></html>')
              
              if not hasattr(dummy, 'css_first'):
                  print("❌ ERROR: css_first 메서드 없음")
                  sys.exit(1)
              
              # 자식 요소에서도 확인
              elements = dummy.css('a')
              if elements and len(elements) > 0:
                  first = elements[0]
                  if not hasattr(first, 'css_first'):
                      print(f"❌ ERROR: 자식 요소(type={type(first).__name__})에 css_first 없음")
                      sys.exit(1)
                  print(f"✅ 자식 요소(type={type(first).__name__})에서 css_first 사용 가능")
              
              print("✅ 모든 API 검증 통과")
              
          except ImportError as e:
              print(f"❌ Scrapling import 실패: {e}")
              sys.exit(1)
          except Exception as e:
              print(f"❌ 검증 실패: {e}")
              sys.exit(1)
          PYEOF
      
      # 🆕 BUSINESSPOST는 브라우저 필요
      - name: Install Scrapling browsers
        if: matrix.site == 'BUSINESSPOST'
        run: |
          # 0.4.2부터는 'scrapling install' 명령
          scrapling install || python -m playwright install chromium --with-deps
      
      - name: Create output directory
        run: mkdir -p output
      
      - name: Run crawler for ${{ matrix.site }}
        run: |
          echo "=== ${{ matrix.site }} 크롤링 시작 ==="
          time python -u news_collector.py 2>&1 | tee output/${{ matrix.site }}_run.log
        env:
          SITE: ${{ matrix.site }}
        continue-on-error: true
      
      - name: Show last logs
        if: always()
        run: |
          ls -lah output/ || echo "No output"
          if [ -f output/${{ matrix.site }}_run.log ]; then
            echo ""
            echo "=== Last 30 lines ==="
            tail -30 output/${{ matrix.site }}_run.log
          fi
      
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-${{ matrix.site }}-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: warn

  merge:
    needs: crawl
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test_scrapling
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install pandas
      
      - uses: actions/download-artifact@v4
        with:
          path: ./all-results
          pattern: scrapling-*-${{ github.run_id }}
      
      - name: Merge CSVs
        run: |
          mkdir -p merged
          python << 'PYEOF'
          import pandas as pd
          import glob
          import re
          from datetime import datetime
          
          all_csvs = glob.glob('all-results/**/*.csv', recursive=True)
          all_csvs = [c for c in all_csvs if not c.endswith('_empty.csv')]
          print(f"Found {len(all_csvs)} CSV files")
          
          if not all_csvs:
              exit(0)
          
          dfs = []
          for csv in sorted(all_csvs):
              try:
                  df = pd.read_csv(csv, encoding='utf-8-sig')
                  if not df.empty:
                      dfs.append(df)
                      print(f"  ✓ {csv}: {len(df)} rows")
              except Exception as e:
                  print(f"  ✗ {csv}: {e}")
          
          if not dfs:
              exit(0)
          
          merged = pd.concat(dfs, ignore_index=True)
          
          if 'title' in merged.columns:
              def normalize_title(t):
                  if pd.isna(t): return ""
                  return re.sub(r'\s+', '', str(t)).lower()
              merged['_norm'] = merged['title'].apply(normalize_title)
              before = len(merged)
              merged = merged.drop_duplicates(subset=['_norm'], keep='first')
              merged = merged.drop(columns=['_norm'])
              print(f"중복: {before} → {len(merged)}")
          
          if 'date' in merged.columns:
              merged = merged.sort_values(by=['date'], ascending=False, na_position='last')
          
          today = datetime.now().strftime('%y%m%d_%H%M%S')
          output = f'merged/{today}_competitor.csv'
          merged.to_csv(output, index=False, encoding='utf-8-sig')
          print(f"✅ {output}: {len(merged)} rows")
          
          if 'provider' in merged.columns:
              print(merged['provider'].value_counts())
          PYEOF
      
      - uses: actions/upload-artifact@v4
        with:
          name: scrapling-merged-final-${{ github.run_id }}
          path: merged/*.csv
          retention-days: 30
          if-no-files-found: warn