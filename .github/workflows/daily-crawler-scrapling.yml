name: Daily News Crawler (Scrapling)

on:
  push:
    branches:
      - test_scrapling
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: 1
  PYTHONIOENCODING: utf-8

jobs:
  # ========================================
  # Job 1: 사이트별 병렬 크롤링 (Phase 1: 3개)
  # ========================================
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Scrapling은 빨라서 15분이면 충분
    
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        site:
          - AITIMES
          - TECHWORLD
          - BUSINESSPOST
    
    steps:
      - name: Checkout test_scrapling
        uses: actions/checkout@v4
        with:
          ref: test_scrapling
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install "scrapling[fetchers]"
          # Scrapling 브라우저 의존성 설치 (StealthyFetcher용)
          # Phase 1에서는 정적 HTML만 사용하므로 일단 생략 가능
          # scrapling install
      
      - name: Show environment info
        run: |
          python --version
          pip show scrapling | head -5
      
      - name: Create output directory
        run: mkdir -p output
      
      - name: Run crawler for ${{ matrix.site }}
        run: |
          echo "=== ${{ matrix.site }} 크롤링 시작 ==="
          time python -u news_collector.py 2>&1 | tee output/${{ matrix.site }}_run.log
        env:
          SITE: ${{ matrix.site }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: 1
        continue-on-error: true
      
      - name: Show output
        if: always()
        run: |
          echo "=== Output for ${{ matrix.site }} ==="
          ls -lah output/ || echo "No output"
          echo ""
          if [ -f output/${{ matrix.site }}_run.log ]; then
            echo "=== Last 30 lines of log ==="
            tail -30 output/${{ matrix.site }}_run.log
          fi
      
      - name: Upload artifact for ${{ matrix.site }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-${{ matrix.site }}-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: warn

  # ========================================
  # Job 2: 결과 병합
  # ========================================
  merge:
    needs: crawl
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: Checkout test_scrapling
        uses: actions/checkout@v4
        with:
          ref: test_scrapling
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install pandas
        run: pip install pandas
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-results
          pattern: scrapling-*-${{ github.run_id }}
      
      - name: Show downloaded files
        run: |
          echo "=== Downloaded ==="
          find all-results -type f | head -30
      
      - name: Merge CSVs
        run: |
          mkdir -p merged
          python << 'PYEOF'
          import pandas as pd
          import glob
          import os
          import re
          from datetime import datetime
          
          all_csvs = glob.glob('all-results/**/*.csv', recursive=True)
          # _empty.csv는 제외
          all_csvs = [c for c in all_csvs if not c.endswith('_empty.csv')]
          
          print(f"Found {len(all_csvs)} CSV files")
          
          if not all_csvs:
              print("⚠️ No CSV files")
              exit(0)
          
          dfs = []
          for csv in sorted(all_csvs):
              try:
                  df = pd.read_csv(csv, encoding='utf-8-sig')
                  if not df.empty:
                      dfs.append(df)
                      print(f"  ✓ {csv}: {len(df)} rows")
              except Exception as e:
                  print(f"  ✗ {csv}: {e}")
          
          if not dfs:
              print("❌ 병합할 데이터 없음")
              exit(0)
          
          merged = pd.concat(dfs, ignore_index=True)
          print(f"\n📊 병합 전: {len(merged)} rows")
          
          # 중복 제거
          if 'title' in merged.columns:
              def normalize_title(text):
                  if pd.isna(text): return ""
                  return re.sub(r'\s+', '', str(text)).lower()
              
              merged['_norm'] = merged['title'].apply(normalize_title)
              before = len(merged)
              merged = merged.drop_duplicates(subset=['_norm'], keep='first')
              merged = merged.drop(columns=['_norm'])
              print(f"🧹 중복 제거: {before} → {len(merged)} rows")
          
          if 'date' in merged.columns:
              merged = merged.sort_values(by=['date'], ascending=False, na_position='last')
          
          today = datetime.now().strftime('%y%m%d_%H%M%S')
          output = f'merged/{today}_competitor.csv'
          merged.to_csv(output, index=False, encoding='utf-8-sig')
          print(f"\n✅ 통합: {output}")
          print(f"📊 최종: {len(merged)} rows")
          
          if 'provider' in merged.columns:
              print("\n=== 사이트별 통계 ===")
              print(merged['provider'].value_counts())
          PYEOF
      
      - name: Show merged result
        run: ls -lah merged/
      
      - name: Upload merged final
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-merged-final-${{ github.run_id }}
          path: merged/*.csv
          retention-days: 30
          if-no-files-found: error
