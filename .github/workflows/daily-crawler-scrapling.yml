name: Daily News Crawler (Scrapling 0.4.7 + uv)

on:
  push:
    branches:
      - test_scrapling
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: 1
  PYTHONIOENCODING: utf-8

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        site:
          - AITIMES
          - TECHWORLD
          - BUSINESSPOST
    
    steps:
      - name: Checkout test_scrapling
        uses: actions/checkout@v4
        with:
          ref: test_scrapling
      
      # 🚀 uv 설치 (10-100배 빠른 pip 대체재)
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      
      - name: Set up Python 3.11
        run: uv python install 3.11
      
      # 🚀 uv로 Scrapling 0.4.7 설치 (매우 빠름)
      - name: Install dependencies with uv
        run: |
          # uv가 자동으로 venv 만들어서 격리된 환경에 설치
          uv venv
          source .venv/bin/activate
          
          # Scrapling 최신 + 의존성
          uv pip install "scrapling[fetchers]>=0.4.2" pandas
          
          echo ""
          echo "=== 설치된 패키지 ==="
          uv pip list | grep -iE "scrapling|playwright|lxml|cssselect"
      
      # 🆕 정확한 API 검증 (0.4+ 기준)
      - name: Verify Scrapling 0.4+ API
        run: |
          source .venv/bin/activate
          python << 'PYEOF'
          import sys
          import scrapling
          v = scrapling.__version__
          print(f"📌 Scrapling 버전: {v}")
          
          # 버전 체크
          parts = v.split('.')
          major, minor = int(parts[0]), int(parts[1])
          if major == 0 and minor < 4:
              print(f"❌ 0.4+ 필요. 현재: {v}")
              sys.exit(1)
          
          # API 검증 (0.4+ 정확한 방식)
          from scrapling.parser import Selector
          dummy = Selector('<html><body><a href="x">test</a></body></html>')
          
          # 1. .css() 메서드
          assert hasattr(dummy, 'css'), "css 메서드 없음"
          
          # 2. Selectors의 .first 속성 (0.4+)
          links = dummy.css('a')
          print(f"✅ css() 반환 타입: {type(links).__name__}")
          
          if hasattr(links, 'first'):
              first = links.first
              print(f"✅ .first 속성 사용 가능: {type(first).__name__}")
          else:
              # [0] 인덱싱 사용
              first = links[0] if len(links) > 0 else None
              print(f"✅ [0] 인덱싱 사용: {type(first).__name__}")
          
          # 3. 자식에서 .css() 호출
          if first:
              children = first.css('::text')
              print(f"✅ 자식 .css(): {type(children).__name__}")
              text = children.get() if hasattr(children, 'get') else None
              print(f"✅ 텍스트: {text}")
          
          # 4. .attrib 사용
          if first and hasattr(first, 'attrib'):
              href = first.attrib.get('href', '')
              print(f"✅ attrib: {href}")
          
          print("\n✅ 모든 0.4+ API 검증 통과")
          PYEOF
      
      # 🆕 BUSINESSPOST는 브라우저 필요
      - name: Install Scrapling browsers
        if: matrix.site == 'BUSINESSPOST'
        run: |
          source .venv/bin/activate
          # 0.4+에서는 'scrapling install' 사용
          scrapling install || python -m playwright install chromium --with-deps
      
      - name: Create output directory
        run: mkdir -p output
      
      - name: Run crawler for ${{ matrix.site }}
        run: |
          source .venv/bin/activate
          echo "=== ${{ matrix.site }} 크롤링 시작 ==="
          time python -u news_collector.py 2>&1 | tee output/${{ matrix.site }}_run.log
        env:
          SITE: ${{ matrix.site }}
        continue-on-error: true
      
      - name: Show last logs
        if: always()
        run: |
          ls -lah output/ || echo "No output"
          if [ -f output/${{ matrix.site }}_run.log ]; then
            echo ""
            echo "=== Last 30 lines ==="
            tail -30 output/${{ matrix.site }}_run.log
          fi
      
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-${{ matrix.site }}-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: warn

  merge:
    needs: crawl
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test_scrapling
      
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      
      - run: |
          uv venv
          source .venv/bin/activate
          uv pip install pandas
      
      - uses: actions/download-artifact@v4
        with:
          path: ./all-results
          pattern: scrapling-*-${{ github.run_id }}
      
      - name: Merge CSVs
        run: |
          source .venv/bin/activate
          mkdir -p merged
          python << 'PYEOF'
          import pandas as pd
          import glob
          import re
          from datetime import datetime
          
          all_csvs = glob.glob('all-results/**/*.csv', recursive=True)
          all_csvs = [c for c in all_csvs if not c.endswith('_empty.csv')]
          print(f"Found {len(all_csvs)} CSV files")
          
          if not all_csvs:
              exit(0)
          
          dfs = []
          for csv in sorted(all_csvs):
              try:
                  df = pd.read_csv(csv, encoding='utf-8-sig')
                  if not df.empty:
                      dfs.append(df)
                      print(f"  ✓ {csv}: {len(df)} rows")
              except Exception as e:
                  print(f"  ✗ {csv}: {e}")
          
          if not dfs:
              exit(0)
          
          merged = pd.concat(dfs, ignore_index=True)
          
          if 'title' in merged.columns:
              def normalize_title(t):
                  if pd.isna(t): return ""
                  return re.sub(r'\s+', '', str(t)).lower()
              merged['_norm'] = merged['title'].apply(normalize_title)
              before = len(merged)
              merged = merged.drop_duplicates(subset=['_norm'], keep='first')
              merged = merged.drop(columns=['_norm'])
              print(f"중복: {before} → {len(merged)}")
          
          if 'date' in merged.columns:
              merged = merged.sort_values(by=['date'], ascending=False, na_position='last')
          
          today = datetime.now().strftime('%y%m%d_%H%M%S')
          output = f'merged/{today}_competitor.csv'
          merged.to_csv(output, index=False, encoding='utf-8-sig')
          print(f"✅ {output}: {len(merged)} rows")
          
          if 'provider' in merged.columns:
              print(merged['provider'].value_counts())
          PYEOF
      
      - uses: actions/upload-artifact@v4
        with:
          name: scrapling-merged-final-${{ github.run_id }}
          path: merged/*.csv
          retention-days: 30
          if-no-files-found: warn
