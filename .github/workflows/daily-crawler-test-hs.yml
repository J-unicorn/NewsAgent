name: Daily News Crawler (Debug)

on:
  push:
    branches:
      - test_hs
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: 1
  PYTHONIOENCODING: utf-8

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout test_hs branch
        uses: actions/checkout@v4
        with:
          ref: test_hs
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Chrome browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      
      - name: Install ChromeDriver
        run: |
          # Chrome 버전에 맞는 ChromeDriver 자동 설치
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          echo "Chrome version: $CHROME_VERSION"
          
          # ChromeDriver는 Chrome과 함께 설치됨 (browser-actions/setup-chrome)
          which chromedriver || echo "chromedriver not in PATH"
          chromedriver --version || echo "chromedriver not found"
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas requests beautifulsoup4 lxml
            pip install selenium webdriver-manager
            pip install feedparser deep-translator numpy
          fi
      
      - name: Test Selenium initialization (debug)
        run: |
          python << 'EOF'
          print("=== Selenium 환경 테스트 시작 ===")
          import sys
          print(f"Python: {sys.version}")
          
          import selenium
          print(f"Selenium: {selenium.__version__}")
          
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_argument('--window-size=1920,1080')
          
          print("ChromeDriver 시작 시도...")
          try:
              driver = webdriver.Chrome(options=options)
              driver.set_page_load_timeout(30)
              print("✅ ChromeDriver 시작 성공!")
              
              print("Google.com 접속 테스트...")
              driver.get('https://www.google.com')
              print(f"✅ 페이지 타이틀: {driver.title}")
              
              driver.quit()
              print("✅ 테스트 완료!")
          except Exception as e:
              print(f"❌ 실패: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF
      
      - name: Create output directory
        run: mkdir -p output
      
      - name: Run news collector (with verbose output)
        run: |
          # -u: unbuffered output (실시간 로그)
          # timeout 1500: 25분 internal timeout
          timeout 1500 python -u news_collector.py 2>&1 | tee output/run.log
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: 1
        continue-on-error: true
      
      - name: Show last logs
        if: always()
        run: |
          echo "=== Last 50 lines of run.log ==="
          tail -50 output/run.log || echo "No log file"
          echo ""
          echo "=== Output files ==="
          ls -lah output/
      
      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-debug-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
