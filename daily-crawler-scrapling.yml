name: Daily News Crawler (Scrapling v2)

on:
  push:
    branches:
      - test_scrapling
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: 1
  PYTHONIOENCODING: utf-8

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        site:
          - AITIMES
          - TECHWORLD
          - BUSINESSPOST
    
    steps:
      - name: Checkout test_scrapling
        uses: actions/checkout@v4
        with:
          ref: test_scrapling
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install "scrapling[fetchers]"
      
      # 🆕 StealthyFetcher용 브라우저 설치 (BUSINESSPOST에 필요)
      # AITIMES, TECHWORLD는 일반 Fetcher라 필요 없지만 통일성을 위해 설치
      - name: Install Scrapling browsers (only for BUSINESSPOST)
        if: matrix.site == 'BUSINESSPOST'
        run: |
          scrapling install
      
      - name: Show environment
        run: |
          python --version
          pip show scrapling | grep -E "Name|Version"
      
      - name: Create output directory
        run: mkdir -p output
      
      - name: Run crawler for ${{ matrix.site }}
        run: |
          echo "=== ${{ matrix.site }} 크롤링 시작 ==="
          time python -u news_collector.py 2>&1 | tee output/${{ matrix.site }}_run.log
        env:
          SITE: ${{ matrix.site }}
        continue-on-error: true
      
      - name: Show output
        if: always()
        run: |
          echo "=== Output for ${{ matrix.site }} ==="
          ls -lah output/ || echo "No output"
          if [ -f output/${{ matrix.site }}_run.log ]; then
            echo ""
            echo "=== Last 30 lines ==="
            tail -30 output/${{ matrix.site }}_run.log
          fi
      
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-${{ matrix.site }}-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: warn

  merge:
    needs: crawl
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test_scrapling
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install pandas
        run: pip install pandas
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-results
          pattern: scrapling-*-${{ github.run_id }}
      
      - name: Merge CSVs
        run: |
          mkdir -p merged
          python << 'PYEOF'
          import pandas as pd
          import glob
          import os
          import re
          from datetime import datetime
          
          all_csvs = glob.glob('all-results/**/*.csv', recursive=True)
          all_csvs = [c for c in all_csvs if not c.endswith('_empty.csv')]
          
          print(f"Found {len(all_csvs)} CSV files")
          
          if not all_csvs:
              print("⚠️ No CSV files")
              exit(0)
          
          dfs = []
          for csv in sorted(all_csvs):
              try:
                  df = pd.read_csv(csv, encoding='utf-8-sig')
                  if not df.empty:
                      dfs.append(df)
                      print(f"  ✓ {csv}: {len(df)} rows")
              except Exception as e:
                  print(f"  ✗ {csv}: {e}")
          
          if not dfs:
              print("❌ 데이터 없음")
              exit(0)
          
          merged = pd.concat(dfs, ignore_index=True)
          
          if 'title' in merged.columns:
              def normalize_title(t):
                  if pd.isna(t): return ""
                  return re.sub(r'\s+', '', str(t)).lower()
              
              merged['_norm'] = merged['title'].apply(normalize_title)
              before = len(merged)
              merged = merged.drop_duplicates(subset=['_norm'], keep='first')
              merged = merged.drop(columns=['_norm'])
              print(f"🧹 중복: {before} → {len(merged)}")
          
          if 'date' in merged.columns:
              merged = merged.sort_values(by=['date'], ascending=False, na_position='last')
          
          today = datetime.now().strftime('%y%m%d_%H%M%S')
          output = f'merged/{today}_competitor.csv'
          merged.to_csv(output, index=False, encoding='utf-8-sig')
          print(f"\n✅ {output}: {len(merged)} rows")
          
          if 'provider' in merged.columns:
              print("\n=== 사이트별 통계 ===")
              print(merged['provider'].value_counts())
          PYEOF
      
      - name: Upload merged
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-merged-final-${{ github.run_id }}
          path: merged/*.csv
          retention-days: 30
          if-no-files-found: warn
